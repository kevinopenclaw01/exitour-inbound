name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 빌드된 모든 쪽의 제목·설명·noindex·JSON-LD(확정되지 않은 값이 나가지 않았는지)를 확인한다
      - run: npm run check:pages
